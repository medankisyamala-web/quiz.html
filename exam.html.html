```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Quiz App</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #e3f2fd, #f8f9fa);
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        .quiz-card {
            max-width: 700px;
            margin: 50px auto;
            border: none;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .option {
            width: 100%;
            padding: 15px;
            margin: 8px 0;
            border: 2px solid #ddd;
            border-radius: 12px;
            background: white;
            text-align: left;
            cursor: pointer;
        }

        .option:hover {
            background: #e7f1ff;
            border-color: #0d6efd;
        }

        .option.selected {
            background: #cfe2ff;
            border-color: #0d6efd;
        }

        .correct {
            background: #d1e7dd !important;
            border-color: #198754 !important;
        }

        .incorrect {
            background: #f8d7da !important;
            border-color: #dc3545 !important;
        }

        #quizPage,
        #resultPage {
            display: none;
        }

        @media (max-width: 576px) {
            .quiz-card {
                margin: 20px 10px;
            }

            .card-body {
                padding: 20px !important;
            }

            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

<!-- ================= HOME PAGE ================= -->
<div id="homePage" class="container">

    <div class="card quiz-card text-center">
        <div class="card-body p-5">

            <h1 class="text-primary fw-bold">📝 Student Quiz</h1>

            <p class="text-muted mt-3">
                Test your knowledge with this simple quiz.
            </p>

            <button class="btn btn-primary btn-lg px-5 mt-3"
                    onclick="startQuiz()">
                Start Quiz
            </button>

        </div>
    </div>

</div>


<!-- ================= QUIZ PAGE ================= -->
<div id="quizPage" class="container">

    <div class="card quiz-card">

        <div class="card-body p-4">

            <!-- Question Number -->
            <div class="d-flex justify-content-between mb-3">

                <span id="questionNumber"
                      class="badge bg-primary fs-6">
                </span>

                <span id="answeredCount"
                      class="text-muted">
                </span>

            </div>

            <!-- Progress Bar -->
            <div class="progress mb-4">
                <div id="progressBar"
                     class="progress-bar"
                     style="width: 0%;">
                </div>
            </div>

            <!-- Question -->
            <h4 id="question" class="fw-bold mb-4"></h4>

            <!-- Options -->
            <div id="options"></div>

            <!-- Buttons -->
            <div class="d-flex justify-content-between mt-4">

                <button id="prevBtn"
                        class="btn btn-outline-secondary"
                        onclick="previousQuestion()">
                    ← Previous
                </button>

                <button id="nextBtn"
                        class="btn btn-primary"
                        onclick="nextQuestion()">
                    Next →
                </button>

            </div>

        </div>
    </div>

</div>


<!-- ================= RESULT PAGE ================= -->
<div id="resultPage" class="container">

    <div class="card quiz-card text-center">

        <div class="card-body p-4">

            <h1 class="text-success fw-bold">
                🎉 Quiz Completed!
            </h1>

            <h2 id="scoreText" class="mt-4"></h2>

            <h3 id="percentageText"
                class="text-primary">
            </h3>

            <!-- Answer Review -->
            <div id="review"
                 class="text-start mt-4">
            </div>

            <button class="btn btn-success btn-lg mt-3"
                    onclick="restartQuiz()">
                🔄 Restart Quiz
            </button>

        </div>
    </div>

</div>


<!-- ================= JAVASCRIPT ================= -->
<script>

    // Quiz Questions
    const questions = [

        {
            question: "Which language is used to create the structure of a web page?",
            options: ["HTML", "Python", "Java", "C"],
            answer: 0
        },

        {
            question: "Which language is used to style web pages?",
            options: ["Java", "CSS", "C++", "Python"],
            answer: 1
        },

        {
            question: "Which language makes a web page interactive?",
            options: ["HTML", "CSS", "JavaScript", "SQL"],
            answer: 2
        },

        {
            question: "Which keyword is used to declare a variable in JavaScript?",
            options: ["var", "int", "string", "define"],
            answer: 0
        },

        {
            question: "Which data structure follows FIFO?",
            options: ["Stack", "Queue", "Tree", "Graph"],
            answer: 1
        }

    ];


    let currentQuestion = 0;

    let userAnswers =
        new Array(questions.length).fill(null);


    // Start Quiz
    function startQuiz() {

        currentQuestion = 0;

        userAnswers =
            new Array(questions.length).fill(null);

        document.getElementById("homePage")
            .style.display = "none";

        document.getElementById("resultPage")
            .style.display = "none";

        document.getElementById("quizPage")
            .style.display = "block";

        showQuestion();
    }


    // Display Question
    function showQuestion() {

        const q = questions[currentQuestion];

        document.getElementById("questionNumber")
            .textContent =
            "Question " +
            (currentQuestion + 1) +
            " of " +
            questions.length;


        document.getElementById("question")
            .textContent = q.question;


        // Answered Count
        const answered =
            userAnswers.filter(
                answer => answer !== null
            ).length;

        document.getElementById("answeredCount")
            .textContent =
            answered + " answered";


        // Progress
        const progress =
            ((currentQuestion + 1) /
            questions.length) * 100;

        document.getElementById("progressBar")
            .style.width = progress + "%";


        // Display Options
        const optionsDiv =
            document.getElementById("options");

        optionsDiv.innerHTML = "";


        q.options.forEach(function(option, index) {

            const button =
                document.createElement("button");

            button.className = "option";

            button.textContent =
                String.fromCharCode(65 + index)
                + ". "
                + option;


            // Selected Answer
            if (userAnswers[currentQuestion] === index) {

                button.classList.add("selected");

            }


            // Select Answer
            button.onclick = function() {

                userAnswers[currentQuestion] =
                    index;

                showQuestion();

            };


            optionsDiv.appendChild(button);

        });


        // Previous Button
        document.getElementById("prevBtn")
            .disabled =
            currentQuestion === 0;


        // Next / Finish Button
        if (currentQuestion === questions.length - 1) {

            document.getElementById("nextBtn")
                .textContent = "Finish ✓";

        } else {

            document.getElementById("nextBtn")
                .textContent = "Next →";

        }

    }


    // Next Question
    function nextQuestion() {

        if (currentQuestion <
            questions.length - 1) {

            currentQuestion++;

            showQuestion();

        } else {

            showResult();

        }

    }


    // Previous Question
    function previousQuestion() {

        if (currentQuestion > 0) {

            currentQuestion--;

            showQuestion();

        }

    }


    // Show Result
    function showResult() {

        let score = 0;


        questions.forEach(function(q, index) {

            if (userAnswers[index] === q.answer) {

                score++;

            }

        });


        // Calculate Percentage
        const percentage =
            Math.round(
                (score / questions.length) * 100
            );


        document.getElementById("quizPage")
            .style.display = "none";

        document.getElementById("resultPage")
            .style.display = "block";


        document.getElementById("scoreText")
            .textContent =
            "Your Score: " +
            score +
            " / " +
            questions.length;


        document.getElementById("percentageText")
            .textContent =
            "Percentage: " +
            percentage +
            "%";


        // Answer Review
        const review =
            document.getElementById("review");

        review.innerHTML =
            "<h4 class='mb-3'>Answer Review</h4>";


        questions.forEach(function(q, index) {

            const item =
                document.createElement("div");

            item.className =
                "mb-3 p-3 rounded border";


            let userAnswer;

            if (userAnswers[index] === null) {

                userAnswer = "Not answered";

            } else {

                userAnswer =
                    q.options[userAnswers[index]];

            }


            const correctAnswer =
                q.options[q.answer];


            // Correct Answer
            if (userAnswers[index] === q.answer) {

                item.classList.add("correct");

                item.innerHTML = `
                    <strong>
                        Q${index + 1}. ${q.question}
                    </strong>
                    <br>
                    Your Answer:
                    ${userAnswer} ✅
                `;

            }

            // Incorrect Answer
            else {

                item.classList.add("incorrect");

                item.innerHTML = `
                    <strong>
                        Q${index + 1}. ${q.question}
                    </strong>
                    <br>
                    Your Answer:
                    ${userAnswer} ❌
                    <br>
                    Correct Answer:
                    ${correctAnswer} ✅
                `;

            }


            review.appendChild(item);

        });

    }


    // Restart Quiz
    function restartQuiz() {

        document.getElementById("resultPage")
            .style.display = "none";

        document.getElementById("homePage")
            .style.display = "block";

    }

</script>

</body>
</html>
